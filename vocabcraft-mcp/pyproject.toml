[project]
name = "vocabcraft-mcp"
version = "0.3.0"
description = "词汇学习与制作一体 MCP Server"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# OCR 引擎依赖 — paddleocr/paddlepaddle 体积大且与 Python 3.13 兼容性较差，
# 拆为可选依赖。运行 `uv sync --extra ocr` 安装。
# OCR 工具内部使用懒加载，未安装时调用 OCR 会得到友好错误提示。
ocr = [
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.5.0",
]
xlsx = [
    "openpyxl>=3.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27",
    "playwright>=1.40",
    "openpyxl>=3.1.0",
]

[project.scripts]
vocabcraft-mcp = "vocabcraft_mcp.server:main"
vocabcraft-web = "vocabcraft_mcp.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ──────────────────────────────────────────
# Pytest 配置
# ──────────────────────────────────────────
[tool.pytest.ini_options]
markers = [
    "e2e: End-to-end tests that require Playwright and a running web server. Run with `uv run pytest -m e2e`, CI splits them into a dedicated job.",
]
asyncio_mode = "auto"
